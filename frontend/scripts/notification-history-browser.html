<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通知履歴削除のブラウザ検証</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;margin:24px;background:#f4f6f9;color:#17233b}
main{max-width:760px;margin:auto}button{padding:10px 18px;font:inherit}li{margin:8px 0}.pass{color:#17663d}.fail{color:#aa2323}
</style>
<main>
  <h1>通知履歴削除のブラウザ検証</h1>
  <p>ローカル専用。実データ・本番API・外部プッシュには接続しません。実際のIndexedDBに、検証専用の一時データベースを作って確認します。</p>
  <button id="run">ブラウザ保存と通知削除を検証する</button>
  <p id="status" role="status">未実施</p>
  <ol id="results"></ol>
</main>
<script type="module">
import { createNotificationHistory, unreadNotifications } from '/src/lib/notificationHistory.js';
const button = document.querySelector('#run');
const status = document.querySelector('#status');
const list = document.querySelector('#results');
const check = (condition, message) => { if (!condition) throw new Error(message); };
button.addEventListener('click', async () => {
  if (location.origin !== 'http://127.0.0.1:5174') throw new Error('Local demo only');
  button.disabled = true; list.replaceChildren(); status.textContent = '検証しています';
  const prefix = `notification-clear-test-${crypto.randomUUID()}-`;
  const databases = new Set(), connections = new Set();
  const device = (name) => createNotificationHistory({
    open(_database, version) {
      const database = prefix + name; databases.add(database);
      const request = indexedDB.open(database, version);
      request.addEventListener('success', () => connections.add(request.result));
      return request;
    },
  });
  let passed = 0;
  const step = async (label, verify) => {
    await verify(); passed += 1;
    const row = document.createElement('li'); row.className = 'pass'; row.textContent = `成功：${label}`; list.append(row);
  };
  try {
    const a = device('open-device'), b = device('closed-device');
    await a.activate('dummy-manager');
    await a.update('dummy-manager', { type: 'push', id: 'old-unread', now: 100000 });
    await a.update('dummy-manager', { type: 'preferences', sound: false, vibration: true });
    await a.activate('dummy-chief');
    await a.update('dummy-chief', { type: 'push', id: 'old-read', now: 100000 });
    await a.update('dummy-chief', { type: 'read', ids: 'all', now: 110000 });
    await a.update('dummy-chief', { type: 'preferences', sound: true, vibration: false });
    await a.activate('dummy-admin');
    await a.update('dummy-admin', { type: 'orders', ids: [], revision: 0, id: 'baseline', now: 100000 });
    await a.update('dummy-admin', { type: 'push', id: 'old-admin', now: 120000 });
    await b.activate('dummy-manager');
    await b.update('dummy-manager', { type: 'orders', ids: [], revision: 0, id: 'baseline', now: 100000 });
    await b.update('dummy-manager', { type: 'push', id: 'old-other-device', now: 120000 });
    await step('削除前に通知の永続保存・未読を確認', async () => {
      const result = await a.read('dummy-admin');
      check(result.persistent && unreadNotifications(result.state) === 1, 'Receipt did not persist');
    });
    await a.clear(17);
    await step('すべてのアカウント・役割の既読／未読履歴を削除', async () => {
      for (const scope of ['dummy-admin', 'dummy-manager', 'dummy-chief']) {
        const result = await a.read(scope);
        check(result.state.entries.length === 0 && result.state.observed.length === 0 && unreadNotifications(result.state) === 0, 'Stored scope was not cleared');
      }
    });
    await step('各アカウントの音・振動設定と現在の利用者を保持', async () => {
      const manager = (await a.read('dummy-manager')).state.preferences;
      const chief = (await a.read('dummy-chief')).state.preferences;
      check(!manager.sound && manager.vibration && chief.sound && !chief.vibration, 'Preferences changed');
      check((await a.receivePush(150000)).scope === 'dummy-admin', 'Active account changed');
    });
    await step('閉じていた端末は次に削除版を取得したときに反映', async () => {
      check(unreadNotifications((await b.read('dummy-manager')).state) === 1, 'Other device changed before connecting');
      const result = await b.update('dummy-manager', { type: 'orders', ids: [], revision: 17, id: 'resume', now: 160000 });
      check(result.cleared && result.state.entries.length === 0, 'Remote clear was not applied');
    });
    await step('削除後の新しい注文は通知を記録', async () => {
      const result = await b.update('dummy-manager', { type: 'orders', ids: ['new-order'], revision: 17, id: 'new-receipt', now: 180000 });
      check(result.newCount === 1 && result.alert && result.state.entries[0].id === 'new-receipt', 'New order was suppressed');
    });
    await step('同じ削除版・古い削除版・古い通信結果から新着を保護', async () => {
      check(!(await b.clear(17)).cleared, 'Same revision cleared again');
      check((await b.clear(16)).ignored, 'Older clear was accepted');
      check((await b.update('dummy-manager', { type: 'orders', ids: ['obsolete'], revision: 0, id: 'late', now: 190000 })).ignored, 'Stale response was accepted');
      check((await b.read('dummy-manager')).state.entries[0].id === 'new-receipt', 'New receipt was removed');
    });
    await step('ブラウザ保存を別インスタンスで再読込しても削除状態と設定を保持', async () => {
      const reopened = device('open-device');
      await reopened.activate('dummy-manager');
      const result = await reopened.read('dummy-manager');
      check(result.persistent && result.state.entries.length === 0 && !result.state.preferences.sound, 'Reopened storage lost reset or preferences');
      check((await reopened.clear(16)).ignored, 'Reset revision did not persist');
    });
    await step('削除と古い応答の同時処理でも削除済み履歴は復活しない', async () => {
      const results = await Promise.all([
        b.clear(18),
        b.update('dummy-manager', { type: 'orders', ids: ['obsolete'], revision: 17, id: 'late-race', now: 200000 }),
      ]);
      check(results[1].ignored && (await b.read('dummy-manager')).state.entries.length === 0, 'Concurrent stale snapshot resurrected a receipt');
    });
    await step('新規端末の初回取得は既存注文を大量通知しない', async () => {
      const first = device('first-visit'); await first.activate('dummy-first');
      const result = await first.update('dummy-first', { type: 'orders', ids: ['existing'], revision: 18, id: 'quiet', now: 220000 });
      check(result.cleared && result.newCount === 0 && result.state.entries.length === 0, 'First visit was noisy');
    });
    status.textContent = `${passed}件すべて成功`;
    status.dataset.success = 'true'; status.dataset.passed = String(passed);
  } catch (error) {
    const row = document.createElement('li'); row.className = 'fail'; row.textContent = `失敗：${error.message}`; list.append(row);
    status.textContent = '検証に失敗しました'; status.dataset.success = 'false';
  } finally {
    // Only this run's uniquely named temporary databases are removed.
    connections.forEach((connection) => connection.close());
    await Promise.all([...databases].map((name) => new Promise((resolve, reject) => {
      const request = indexedDB.deleteDatabase(name); request.onsuccess = resolve;
      request.onerror = request.onblocked = () => reject(new Error('Temporary test database cleanup failed'));
    }))).catch(() => { status.textContent += '（一時検証データの片付けが未完了）'; status.dataset.success = 'false'; });
    button.disabled = false;
  }
});
</script>
</html>
